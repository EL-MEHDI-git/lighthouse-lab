# =============================================================================
# Golden set — domaine « ai_engineering »
#
# Rôle : jeu de questions de référence pour mesurer le retrieval.
#        Chaque question liste les documents qui DEVRAIENT apparaître dans le
#        top-k. Le script scripts/eval_golden.py en déduit Recall@k et MRR.
#
# Pourquoi des `source` et pas des IDs de chunks ?
#   Les IDs changent dès qu'on re-découpe le corpus. Les noms de fichiers, non.
#   Le golden set survit donc au re-chunking, au re-embedding et au
#   contextual retrieval. C'est ce qui le rend réutilisable.
#
# Champs :
#   id               identifiant stable (q01, q02, …) — ne jamais réutiliser
#   question         la requête telle qu'un utilisateur l'écrirait
#   category         à quoi sert ce cas (voir la liste ci-dessous)
#   expected_sources documents pertinents — au moins UN doit être dans le top-k
#   anchor           extrait de texte présent dans le 1er expected_source
#                    (sert à vérifier que le golden set reste valide)
#   notes            pourquoi ce cas est intéressant
#
# Catégories :
#   acronym           acronyme / terme rare — le dense seul peut le rater
#   lexical_noise     mots courants qui font remonter du bruit en full-text
#   natural           question formulée naturellement
#   concept           sujet transverse, souvent couvert par plusieurs documents
#   product           nom de produit / partenariat / chiffre précis
#
# Ajouter une question : copier un bloc, prendre le prochain id libre, vérifier
# que les `source` existent en base (le script le fait automatiquement).
# =============================================================================

domain: ai_engineering
version: 1
updated: "2026-11-11"

questions:
  # --- Acronymes / termes rares -------------------------------------------
